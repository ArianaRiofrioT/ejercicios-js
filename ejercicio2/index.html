<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Verificador de Contraseña</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="recuadro">
        <a href="../index.html" class="btn-volver">← Volver al menú</a>

        <h1>Verificador de Contraseña</h1>
        
        <div>
            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" placeholder="Escribe una contraseña">
        </div>

        <button id="btn-verificar" type="button">Verificar</button>

        <ul class="reglas">
            <li id="regla-longitud">✗ Al menos ocho caracteres</li>
            <li id="regla-digito">✗ Al menos un dígito (0-9)</li>
            <li id="regla-espacios">✗ Libre de espacios</li>
        </ul>

        <p id="mensaje-final"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
